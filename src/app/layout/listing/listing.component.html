        <nav mat-tab-nav-bar class="list-tabs" [tabPanel]="tabPanel">
          @for (tab of tabs(); track tab?.key) {
            <a
              mat-tab-link
              [routerLink]="['/home/' + tab?.key + '/listing']"
              [active]="rla.isActive"
              #rla="routerLinkActive"
              routerLinkActive="active">
              {{ tab?.label }}
            </a>
          }
        </nav>
        <mat-tab-nav-panel #tabPanel>
          <div class="listing">

            @for(item of data(); track item?.key){
              <div class="name">{{item?.full_name}}</div>
              <div class="phone">{{item?.phone_number}}</div>
              <div class="created_at">date: {{item?.created_at | getTimeAgo}}</div>
              <div class="date_expired">{{item?.date_expired?.toDate() | date:'dd/MM/yyyy'}}</div>
            }
  
          </div>
        </mat-tab-nav-panel>
      
  </div>
  
  <div class="create-form">
