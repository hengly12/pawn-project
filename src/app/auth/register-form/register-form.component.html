<div class="register-container">
  <div class="welcome">
    <h1>
      Welcome To Our App.
    </h1>
    <p>
      Please Log In Or Register To Start Using Our App.
    </p>
  </div>
  <mat-card>
      <img src="assets/images/pawn-logo.jpg" alt="Logo" class="logo">
      <mat-card-header>
          </mat-card-header>
      
      <form [formGroup]="registerForm" (ngSubmit)="register()">
      
          <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email">
              <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
                  Email is required.
              </mat-error>
              <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
                  Please enter a valid email address.
              </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
              <mat-label>Password</mat-label>
              <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
              <button class="show-hide" mat-icon-button matSuffix (click)="togglePasswordVisibility()" [attr.aria-label]="'Toggle password visibility'" type="button">
                  <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
              <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
                  Password is required.
              </mat-error>
              <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
                  Password must be at least 6 characters long.
              </mat-error>
          </mat-form-field>

          <div class="button">
              <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid">
              Register
              </button>
          </div>
          <div class="login-link">
            Already Have An Account? <a routerLink="/auth/login">Login</a>
          </div>
      </form>
      

      </mat-card>
</div>
