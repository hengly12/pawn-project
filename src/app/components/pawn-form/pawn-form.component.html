<div class="form-container">
    <h2>Pawn Form</h2>
    <form [formGroup]="pawnForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div>
          <label>Full Name</label>
          <input type="text" formControlName="fullName">
        </div>
        <div>
          <label>Gender</label>
          <select formControlName="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div>
          <label>Phone</label>
          <input type="text" formControlName="phone">
        </div>
        <div>
          <label>ID Card</label>
          <input type="text" formControlName="idCard">
        </div>
        <div>
          <label>Address</label>
          <input type="text" formControlName="address">
        </div>
        <div>
          <label>Pawn Item</label>
          <input type="text" formControlName="pawnItem">
        </div>
        <div>
          <label>Date Created</label>
          <input type="datetime-local" formControlName="dateCreated">
        </div>
        <div>
          <label>Expire Date</label>
          <input type="date" formControlName="expireDate">
        </div>
        <div>
            <label>Description</label>
            <textarea style="height: 60px;" formControlName="description"></textarea>
          </div>
      </div>
      <div class="image-upload">
        <label>Upload Image</label>
        <input type="file" (change)="onImageUpload($event)">
        <div class="image-preview" *ngIf="imagePreview">
          <img [src]="imagePreview" alt="Preview">
        </div>
      </div>
      
      <button type="submit">Submit Form</button>
    </form>
  </div>
